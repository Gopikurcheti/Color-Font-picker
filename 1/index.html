<!DOCTYPE html>
<html>
    <head>
        <title>JS Revision</title>
    </head>
    <body>
        <img src="off.png" id="img">

        <button onclick="on()">ON</button>
        <button onclick="off()">OFF</button>
        
    </body>

    <script>
        function on(){
            document.getElementById('img').src="on.png"
        }

        function off(){
            document.getElementById('img').src="off.png"
        }
    </script>
    
</html>
